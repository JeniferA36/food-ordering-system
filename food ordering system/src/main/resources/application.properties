# ============================================================
# application.properties  (H2 default profile)
# ============================================================

spring.application.name=food-ordering-system

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── H2 datasource (default / local / test) ──────────────────
spring.datasource.url=jdbc:h2:mem:foodorderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────
# In production replace this with a 256-bit base64-encoded secret
app.jwt.secret=ZmQzNjI2MjVmYzgxMzI0NGE0NWMyZWJlMTk4YTZlMzQ1ZjFhYzg3YzJlZTQ5ZjI3ZGM0OTBlY2I1MTBkMzQ=
app.jwt.expiration-ms=86400000

# ── OpenAPI / Swagger ────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Seed data ────────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
